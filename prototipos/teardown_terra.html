<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Despiece Terra — Climate 3D</title>
<style>
  /* Fuente del repo (Archivo variable). Si el archivo se mueve, cae al stack del sistema. */
  @font-face {
    font-family: "Archivo";
    src: url("../app/web/src/fonts/archivo-latin.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --paper: #f4f4f1;
    --card: #fbfbf9;
    --ink: #1c1e21;
    --ink-66: rgba(28, 30, 33, 0.78);
    --ink-52: rgba(28, 30, 33, 0.62);
    --hair: rgba(28, 30, 33, 0.14);
    --hair-strong: rgba(28, 30, 33, 0.26);
    --iris: #5e6ad2;
    --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    caret-color: var(--iris);
    overflow: hidden;
  }

  ::selection { background: var(--iris); color: #fff; }

  :focus-visible {
    outline: 2px solid var(--iris);
    outline-offset: 2px;
    border-radius: 4px;
  }

  * { scrollbar-width: thin; scrollbar-color: rgba(28, 30, 33, 0.28) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb {
    background: rgba(28, 30, 33, 0.24);
    border-radius: 999px;
    border: 3px solid var(--card);
  }
  *::-webkit-scrollbar-track { background: transparent; }

  .stage { position: fixed; inset: 0; }

  .canvas {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .canvas.arrastrando { cursor: grabbing; }
  .canvas svg { display: block; width: 100%; height: 100%; }

  /* ---- bloque de título ---- */
  .titulo {
    position: absolute;
    top: 22px;
    left: 26px;
    pointer-events: none;
    max-width: min(560px, calc(100vw - 52px));
  }
  .titulo h1 {
    margin: 0 0 6px;
    font: 600 26px/1.1 var(--sans);
    letter-spacing: -0.03em;
    text-wrap: balance;
  }
  .titulo .bajada {
    margin: 0 0 3px;
    font-size: 13px;
    color: var(--ink-66);
    text-wrap: pretty;
  }
  .titulo .specs {
    margin: 0;
    font: 400 11px/1.4 var(--mono);
    color: var(--ink-52);
    font-variant-numeric: tabular-nums;
  }

  /* ---- ficha técnica (convención de plano) ---- */
  .ficha {
    position: absolute;
    right: 22px;
    bottom: 22px;
    pointer-events: none;
    border-top: 1px solid var(--hair-strong);
    padding-top: 8px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 2px 14px;
    font: 400 10px/1.6 var(--mono);
    color: var(--ink-52);
    font-variant-numeric: tabular-nums;
  }
  .ficha dt {
    font-family: var(--sans);
    font-size: 8.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-52);
  }
  .ficha dd { margin: 0; color: var(--ink-66); }

  /* ---- barra de controles ---- */
  .barra {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px;
    width: max-content;
    max-width: calc(100vw - 24px);
    background: var(--card);
    border: 1px solid var(--hair);
    border-radius: 999px;
    box-shadow:
      0 1px 2px rgba(28, 30, 33, 0.08),
      0 10px 30px rgba(28, 30, 33, 0.12);
    z-index: 10;
  }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    height: 40px;
    background: rgba(28, 30, 33, 0.05);
    border-radius: 999px;
  }
  .seg button {
    height: 36px;
    min-width: 40px;
    padding: 0 13px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-66);
    font: 500 12.5px/1 var(--sans);
    cursor: pointer;
    transition-property: background-color, color, box-shadow, transform;
    transition-duration: 140ms, 140ms, 140ms, 110ms;
    transition-timing-function: var(--ease);
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow:
      0 1px 1px rgba(28, 30, 33, 0.06),
      0 2px 6px rgba(28, 30, 33, 0.10);
  }
  .seg button:active { transform: scale(0.96); }

  .sep {
    width: 1px;
    height: 16px;
    margin: 0 4px;
    background: var(--hair);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 40px;
    min-width: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: 500 12.5px/1 var(--sans);
    cursor: pointer;
    transition-property: background-color, transform, opacity;
    transition-duration: 140ms, 110ms, 140ms;
    transition-timing-function: var(--ease);
  }
  .btn:hover { background: rgba(28, 30, 33, 0.07); }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .btn svg { flex: none; }

  .zoom-out {
    width: 46px;
    text-align: center;
    font: 500 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-66);
  }

  /* ---- popover de piezas ---- */
  .pop {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 80px;
    width: min(360px, calc(100vw - 24px));
    max-height: min(520px, 62vh);
    overflow: auto;
    padding: 6px;
    background: var(--card);
    border: 1px solid var(--hair-strong);
    border-radius: 14px;
    box-shadow:
      0 2px 6px rgba(28, 30, 33, 0.10),
      0 18px 44px rgba(28, 30, 33, 0.16);
  }
  .pop[hidden] { display: none; }

  .pop .pop-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 9px 6px;
    font: 500 11px/1.4 var(--sans);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-52);
  }
  .pop .pop-head span:last-child {
    font-family: var(--mono);
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }

  .pop ul { list-style: none; margin: 0; padding: 0; }

  .pop .fila {
    display: grid;
    grid-template-columns: 26px 1fr;
    align-items: center;
    gap: 0 8px;
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-left: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    transition-property: background-color, border-color;
    transition-duration: 130ms;
    transition-timing-function: var(--ease);
  }
  .pop .fila:hover { background: rgba(28, 30, 33, 0.05); }
  .pop .fila:focus-visible { outline-offset: -2px; border-radius: 8px; }
  .pop .fila[aria-current="true"] {
    background: rgba(28, 30, 33, 0.05);
    border-left-color: var(--iris);
  }
  .pop .num {
    font: 600 11px/1 var(--mono);
    color: var(--ink-52);
    font-variant-numeric: tabular-nums;
    grid-row: span 2;
  }
  .pop .nom { font: 600 12.5px/1.25 var(--sans); letter-spacing: -0.01em; }
  .pop .det {
    font: 400 11px/1.35 var(--mono);
    color: var(--ink-52);
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 1180px) {
    .ficha { display: none; }
  }
  @media (max-width: 720px) {
    .titulo { top: 16px; left: 16px; }
    .titulo h1 { font-size: 20px; }
    .titulo .specs { display: none; }
    .barra {
      bottom: 12px;
      width: calc(100vw - 24px);
      border-radius: 20px;
      padding: 6px;
      row-gap: 4px;
    }
    .pop { bottom: 132px; }
    .btn .txt { display: none; }
    .btn { padding: 0 11px; }
    .seg button { padding: 0 10px; }
  }

  @media (pointer: coarse) {
    .btn, .seg button { min-width: 44px; height: 44px; }
    .seg { height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      transition-delay: 0ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage" id="stage">

  <div class="canvas" id="canvas" role="region"
       aria-label="Dibujo del satélite Terra. Usa más y menos para acercar o alejar, y cero para ajustar.">
    <svg id="drawing" viewBox="0 0 960 640" data-view="despiezado" role="group"
         aria-labelledby="dibujo-titulo" preserveAspectRatio="xMidYMid meet">
      <title id="dibujo-titulo">Despiece del satélite Terra (EOS AM-1)</title>

      <style>
        /* Todo el estilo del dibujo vive dentro del SVG para que la descarga sea autocontenida. */
        .part {
          cursor: pointer;
          transform: translate(var(--dx, 0px), var(--dy, 0px));
          transition-property: transform, opacity;
          transition-duration: 550ms, 150ms;
          transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1), ease-out;
          transition-delay: calc(var(--i) * 40ms), 0ms;
        }
        svg[data-view="armado"] .part {
          transform: translate(0px, 0px);
          transition-delay: calc(var(--i) * 22ms), 0ms;
        }

        .face { stroke: #1c1e21; stroke-linejoin: round; }
        .f-front, .f-side { stroke-width: 0.9; }
        .f-top { stroke-width: 0.55; }
        .f-front { fill: #d7d8d4; }
        .f-top { fill: #e6e6e3; }
        .f-side { fill: #bfc0be; }

        .ln { fill: none; stroke: #1c1e21; stroke-linecap: round; stroke-linejoin: round; }
        .ln-edge { stroke-width: 0.55; }
        .ln-detail { stroke-width: 0.32; }
        .ln-tex { stroke-width: 0.22; opacity: 0.5; }

        .part:hover .f-front, .part.is-hot .f-front { fill: #cbccc8; }
        .part:hover .f-side, .part.is-hot .f-side { fill: #b2b3b1; }

        .part:focus { outline: none; }
        .part:focus-visible .face, .part:focus-visible .ln,
        .part.is-selected .face, .part.is-selected .ln { stroke: #5e6ad2; }
        .part:focus-visible .f-front, .part.is-selected .f-front { fill: #d3d6ea; }
        .part:focus-visible .f-top, .part.is-selected .f-top { fill: #e6e8f2; }
        .part:focus-visible .f-side, .part.is-selected .f-side { fill: #c2c7e4; }

        .has-selection .part:not(.is-selected) { opacity: 0.35; }

        .callout { pointer-events: none; }
        .co-line {
          fill: none;
          stroke: #1c1e21;
          stroke-width: 0.45;
          stroke-dasharray: 1;
          stroke-dashoffset: 1;
          transition: stroke-dashoffset 160ms ease-out;
        }
        .co-dot, .co-badge, .co-num, .co-name, .co-spec {
          opacity: 0;
          transition: opacity 120ms ease-out;
        }
        .co-dot { fill: #1c1e21; }
        .co-badge { fill: #fbfbf9; stroke: #1c1e21; stroke-width: 0.45; }
        .co-num {
          font: 600 8.5px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
          fill: #1c1e21;
          text-anchor: middle;
          font-variant-numeric: tabular-nums;
        }
        .co-name {
          font: 600 11.5px/1 "Archivo", "Segoe UI", system-ui, sans-serif;
          fill: #1c1e21;
          letter-spacing: -0.01em;
        }
        .co-spec {
          font: 400 8.5px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
          fill: rgba(28, 30, 33, 0.66);
          font-variant-numeric: tabular-nums;
        }

        svg[data-view="despiezado"] .co-line {
          stroke-dashoffset: 0;
          transition: stroke-dashoffset 500ms cubic-bezier(0.23, 1, 0.32, 1) calc(var(--i) * 45ms + 100ms);
        }
        svg[data-view="despiezado"] .co-dot,
        svg[data-view="despiezado"] .co-badge,
        svg[data-view="despiezado"] .co-num {
          opacity: 1;
          transition: opacity 200ms ease-out calc(var(--i) * 45ms + 430ms);
        }
        svg[data-view="despiezado"] .co-name,
        svg[data-view="despiezado"] .co-spec {
          opacity: 1;
          transition: opacity 220ms ease-out calc(var(--i) * 45ms + 480ms);
        }

        .has-selection .callout:not(.is-sel) { opacity: 0.22; }

        @media (prefers-reduced-motion: reduce) {
          .part, .co-line, .co-dot, .co-badge, .co-num, .co-name, .co-spec {
            transition-duration: 0.01ms !important;
            transition-delay: 0ms !important;
          }
        }

        /* En pantallas angostas el dibujo se ve más chico: se compensa el rótulo. */
        @media (max-width: 720px) {
          .co-name { font-size: 15px; }
          .co-spec { font-size: 10.5px; }
          .co-num { font-size: 11px; }
        }
      </style>

      <g id="lienzo">

        <defs>

            <path d="M0 0H16M0 11H16M8 0V11" fill="none" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.4"/>

        </defs>

        <!-- 01 · Plataforma EOS -->

          <polygon class="face f-side" points="482,352 490,352 488,361 483,361"/>
          <circle class="ln ln-detail" cx="502" cy="356" r="3"/>
        </g>

        <!-- 02 · Radiadores -->
        <g class="part" data-part="radiadores" style="--dx:0px;--dy:-52px;--i:1"
           role="button" tabindex="0" aria-pressed="false"
           aria-label="02, Radiadores, disipan el calor del bus">
          <polygon class="face f-top" points="468,244 508,244 536,227 496,227"/>
          <polygon points="468,244 508,244 536,227 496,227" fill="url(#tex-lamas)" stroke="none"/>

        <!-- 03 · MODIS -->
        <g class="part" data-part="modis" style="--dx:-44px;--dy:100px;--i:2"
           role="button" tabindex="0" aria-pressed="false"

        <!-- 04 · ASTER -->
        <g class="part" data-part="aster" style="--dx:8px;--dy:122px;--i:3"
           role="button" tabindex="0" aria-pressed="false"

          <polygon class="face f-top" points="490,258 520,258 526,254 496,254"/><polygon class="face f-side" points="520,258 526,254 526,280 520,284"/><rect class="face f-front" x="490" y="258" width="30" height="26"/>

        <!-- 05 · CERES -->
        <g class="part" data-part="ceres" style="--dx:30px;--dy:140px;--i:4"
           role="button" tabindex="0" aria-pressed="false"
           aria-label="05, CERES, tres radiómetros de balance radiativo">
          <polygon class="face f-top" points="526,258 554,258 560,254 532,254"/><polygon class="face f-side" points="554,258 560,254 560,278 554,282"/><rect class="face f-front" x="526" y="258" width="28" height="24"/>

        <!-- 06 · MISR -->
        <g class="part" data-part="misr" style="--dx:-96px;--dy:128px;--i:5"
           role="button" tabindex="0" aria-pressed="false"
           aria-label="06, MISR, nueve cámaras en ángulos distintos">
          <polygon class="face f-top" points="428,306 476,306 482,302 434,302"/><polygon class="face f-side" points="476,306 482,302 482,336 476,340"/><rect class="face f-front" x="428" y="306" width="48" height="34"/>
          <circle class="ln ln-edge" cx="438" cy="320" r="4.6"/>
          <circle class="ln ln-edge" cx="452" cy="320" r="4.6"/>

<script>
  const svg = document.getElementById("drawing");
  const canvas = document.getElementById("canvas");
  const stage = document.getElementById("stage");
  const out = document.getElementById("zoom-level");
  const pop = document.getElementById("pop");
  const popBtn = document.getElementById("parts-btn");
  const zoomInBtn = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");

  const VW = 960;
  const VH = 640;
  const ZMIN = 0.6;
  const ZMAX = 5;

  let zoom = 1;
  let cx = VW / 2;
  let cy = VH / 2;
  let selected = null;

  function currentBox() {
    const w = VW / zoom;
    const h = VH / zoom;
    return { x: cx - w / 2, y: cy - h / 2, w, h };
  }

  function applyView() {
    const b = currentBox();
    svg.setAttribute("viewBox", b.x + " " + b.y + " " + b.w + " " + b.h);
    out.textContent = Math.round(zoom * 100) + "%";
    zoomOutBtn.disabled = zoom <= ZMIN + 0.001;
    zoomInBtn.disabled = zoom >= ZMAX - 0.001;
  }

  function setZoom(next, anchor) {
    const clamped = Math.min(ZMAX, Math.max(ZMIN, next));
    if (anchor) {
      const b = currentBox();
      const fx = (anchor.x - b.x) / b.w;
      const fy = (anchor.y - b.y) / b.h;
      zoom = clamped;
      const w = VW / zoom;
      const h = VH / zoom;
      cx = anchor.x + w * (0.5 - fx);
      cy = anchor.y + h * (0.5 - fy);
    } else {
      zoom = clamped;
    }
    applyView();
  }

  function fit() {
    zoom = 1;
    cx = VW / 2;
    cy = VH / 2;
    applyView();
  }

  function toSvg(clientX, clientY) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const p = svg.createSVGPoint();
    p.x = clientX;
    p.y = clientY;
    return p.matrixTransform(m.inverse());
  }

  /* ---- vista despiezado / armado ---- */
  const viewBtns = Array.from(document.querySelectorAll(".seg [role='radio']"));

  function setView(view) {
    svg.setAttribute("data-view", view);
    for (const b of viewBtns) {
      const on = b.dataset.view === view;
      b.setAttribute("aria-checked", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
    }
  }

  for (const b of viewBtns) {
    b.addEventListener("click", function () { setView(b.dataset.view); });
  }

  document.querySelector(".seg").addEventListener("keydown", function (e) {
    let step = 0;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") step = 1;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") step = -1;
    if (!step) return;
    e.preventDefault();
    const i = viewBtns.findIndex(function (b) { return b.getAttribute("aria-checked") === "true"; });
    const next = viewBtns[(i + step + viewBtns.length) % viewBtns.length];
    setView(next.dataset.view);
    next.focus();
  });

  /* ---- selección de pieza ---- */
  function selectPart(id) {
    selected = selected === id ? null : id;

    for (const el of svg.querySelectorAll(".part")) {
      const on = el.dataset.part === selected;
      el.classList.toggle("is-selected", on);
      el.setAttribute("aria-pressed", on ? "true" : "false");
    }
    stage.classList.toggle("has-selection", !!selected);
    for (const c of svg.querySelectorAll(".callout")) {
      c.classList.toggle("is-sel", c.dataset.for === selected);
    }
    for (const row of pop.querySelectorAll("[data-part]")) {
      if (row.dataset.part === selected) row.setAttribute("aria-current", "true");
      else row.removeAttribute("aria-current");
    }
  }

  /* ---- arrastre y clic ---- */
  let drag = null;
  let suppressClick = false;

  svg.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, cx: cx, cy: cy, moved: false };
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener("pointermove", function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      canvas.classList.add("arrastrando");
    }
    if (!drag.moved) return;
    const m = svg.getScreenCTM();
    const upp = m ? 1 / (m.a || 1) : 1;
    cx = drag.cx - dx * upp;
    cy = drag.cy - dy * upp;
    applyView();
  });

  function endDrag() {
    if (drag && drag.moved) {
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 0);
    }
    drag = null;
    canvas.classList.remove("arrastrando");
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  svg.addEventListener("click", function (e) {
    if (suppressClick) return;
    const part = e.target.closest(".part");
    if (part) selectPart(part.dataset.part);
    else if (selected) selectPart(null);
  });

  svg.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    const part = e.target.closest(".part");
    if (!part) return;
    e.preventDefault();
    selectPart(part.dataset.part);
  });

  /* ---- zoom ---- */
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    const p = toSvg(e.clientX, e.clientY);
    if (!p) return;
    setZoom(zoom * (e.deltaY < 0 ? 1.18 : 1 / 1.18), p);
  }, { passive: false });

  zoomInBtn.addEventListener("click", function () { setZoom(zoom * 1.25); });
  zoomOutBtn.addEventListener("click", function () { setZoom(zoom / 1.25); });

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "+" || e.key === "=") {
      e.preventDefault();
      setZoom(zoom * 1.25);
    } else if (e.key === "-" || e.key === "_") {
      e.preventDefault();
      setZoom(zoom / 1.25);
    } else if (e.key === "0") {
      e.preventDefault();
      fit();
    } else if (e.key === "Escape") {
      if (!pop.hidden) closePop();
      else if (selected) selectPart(null);
    }
  });

  /* ---- popover de piezas ---- */
  function openPop() {
    pop.hidden = false;
    popBtn.setAttribute("aria-expanded", "true");
    const first = pop.querySelector(".fila");
    if (first) first.focus();
  }
  function closePop(refocus) {
    pop.hidden = true;
    popBtn.setAttribute("aria-expanded", "false");
    if (refocus !== false) popBtn.focus();
  }
  popBtn.addEventListener("click", function () {
    if (pop.hidden) openPop();
    else closePop();
  });

  document.addEventListener("pointerdown", function (e) {
    if (pop.hidden) return;
    if (pop.contains(e.target) || popBtn.contains(e.target)) return;
    closePop(false);
  });

  pop.addEventListener("click", function (e) {
    const row = e.target.closest("[data-part]");
    if (!row) return;
    selectPart(row.dataset.part);
    closePop(false);
  });

  pop.addEventListener("pointerover", function (e) {
    const row = e.target.closest("[data-part]");
    if (!row) return;
    const el = svg.querySelector('.part[data-part="' + row.dataset.part + '"]');
    if (el) el.classList.add("is-hot");
  });
  pop.addEventListener("pointerout", function (e) {
    const row = e.target.closest("[data-part]");
    if (!row) return;
    const el = svg.querySelector('.part[data-part="' + row.dataset.part + '"]');
    if (el) el.classList.remove("is-hot");
  });

  /* ---- descarga del SVG ---- */
  document.getElementById("download-btn").addEventListener("click", function () {
    const clone = svg.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", "1920");
    clone.setAttribute("height", "1280");
    for (const el of clone.querySelectorAll(".is-hot")) el.classList.remove("is-hot");
    const data = new XMLSerializer().serializeToString(clone);
    const url = URL.createObjectURL(new Blob([data], { type: "image/svg+xml" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = "terra-despiece.svg";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  });

  applyView();

  /* En pantallas angostas arrancamos con el satélite legible; el resto se recorre con arrastre y zoom. */
  if (window.matchMedia("(max-width: 720px)").matches) {
    zoom = 1.5;
    cx = 480;
    cy = 330;
    applyView();
  }
</script>

</body>
</html>
