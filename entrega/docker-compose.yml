# Climate 3D en Docker — paquete para otra persona.
#
# No necesita el repositorio: la imagen viene compilada del registry. Lo único
# configurable es el lado host, en `.env` (lo genera setup.ps1 / setup.sh).
#
# El puerto se publica en loopback porque la API no tiene autenticación y ejecuta
# subprocesos: no la expongas a la red abriéndola en 0.0.0.0.
name: climate3d

services:
  app:
    # Cambiá USUARIO por tu cuenta de GitHub. Pinneá una versión (`:1.0.0`) en vez
    # de `:latest` cuando quieras que todos corran exactamente lo mismo.
    image: ${IMAGE:-ghcr.io/USUARIO/climate3d:latest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    volumes:
      # Los .nc, las salidas y el estado de los jobs viven en su disco, no en la imagen.
      - "${DATA_DIR:?falta DATA_DIR: corré setup.ps1 o setup.sh, o copiá env.example a .env}:/data"
      # Los artefactos de los jobs sobreviven a un reinicio.
      - "${DATA_DIR}/.media:/app/app/var/media"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
