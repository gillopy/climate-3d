# Climate 3D en Docker: un servicio, un volumen de datos.
#
# El puerto se publica en loopback porque la API no tiene autenticación y ejecuta
# subprocesos: no la expongas a la red abriéndola en 0.0.0.0.
name: climate3d

services:
  app:
    build:
      # El contexto es la raíz del repo: la imagen copia el pipeline y la web.
      context: ..
      dockerfile: despliegue/Dockerfile
      # Sella el commit en la imagen; ARRANCAR-DOCKER.bat lo compara con HEAD.
      args:
        CLIMATE3D_COMMIT: ${CLIMATE3D_COMMIT:-desconocido}
    # Si ya hay una imagen (compilada acá, cargada de un .tar o publicada en un
    # registry), se usa esa y no se compila. `IMAGE=ghcr.io/usuario/climate3d:1.0`.
    image: ${IMAGE:-climate3d:local}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    volumes:
      # Una sola raíz: los .nc, las salidas y los artefactos de los jobs (`.media/`)
      # viven en tu disco, no en la imagen. Sobreviven a un rebuild.
      - "${DATA_DIR:?falta DATA_DIR: corré setup.ps1 o setup.sh, o copiá env.example a .env}:/data"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    # Los renders son pesados a propósito: usan todos los núcleos que encuentren.
    # Si necesitás acotarlos, descomentá:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8g
